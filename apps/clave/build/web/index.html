<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tu puente hacia el inglés — aprende inglés paso a paso.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Clave">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Clave — English Bridge</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Native Web Audio & Speech Context Unlocker -->
  <script>
    // 1. Web Speech API Shim
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    // 2. Web Audio Context Unlocker
    document.addEventListener('click', function unlockAudioContext() {
      if (window.AudioContext || window.webkitAudioContext) {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        var audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }
      document.removeEventListener('click', unlockAudioContext);
    }, { once: true });
    
    document.addEventListener('touchstart', function unlockAudioContextTouch() {
      if (window.AudioContext || window.webkitAudioContext) {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        var audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }
      document.removeEventListener('touchstart', unlockAudioContextTouch);
    }, { once: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
